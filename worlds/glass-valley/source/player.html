<script type="module">const GLASS_TEXTURE="/assets/runtime/glass-valley/images/1c57ff3cf0eef0fe2a531ed2c902ca7e8b66f43d4f56e6dc7248284df27a38b4.png";
const MOTIF_TEXTURE="/assets/runtime/glass-valley/images/7353c95c31ed7134a48b4ca84f31e99323fad7008ae39d2436a827fbec8332c3.png";
import { TAU,clamp,mix,random,normalize,cross,sub,add,scale,identity,transform,multiply,perspective,lookAt,damp,parseSeed,VALLEY,PROFILES,routeCenter,wantedChunks,MeshBuilder,skyGeometry,groundGeometry,cloudRibbon } from './geometry.js';
import { TerrainStream } from './terrain-stream.js';

/** Art-directed stained glass. All textures and meshes are authored by this app. */
const COMMON_GLSL = `
precision highp float;
uniform sampler2D uGlass;
uniform sampler2D uMotif;
uniform float uTime;
uniform float uPhase;
uniform vec3 uSun;
uniform vec3 uMoon;
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
vec3 cell(vec2 p){
 vec2 i=floor(p),f=fract(p);float a=9.,b=9.,id=0.;
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
  vec2 o=vec2(float(x),float(y)),h=hash22(i+o),d=o+.16+.68*h-f;float q=dot(d,d);
  if(q<a){b=a;a=q;id=h.x;}else b=min(b,q);
 }return vec3((sqrt(b)-sqrt(a))*.6,id,sqrt(a));
}
float line(float d,float w){float a=max(fwidth(d)*.7,.0005);return 1.-smoothstep(w-a,w+a,d);}
vec3 materialNoise(vec2 p){return texture(uGlass,p).rgb;}
vec3 marbled(vec3 c,vec2 p,float strength){
 vec3 m=materialNoise(p);vec3 b=materialNoise(p*2.13+vec2(.34,.72));
 float vein=pow(m.g,3.0)*(.4+.6*m.r);float cloud=m.r-.5;
 return c*(.83+.48*cloud+.20*b.b)+mix(c,vec3(.93,.96,.81),.66)*(vein*.22+pow(b.g,5.)*.045)*strength;
}
vec3 leaded(vec3 c,float edge,float width,float metallic,float show){
 float seam=line(edge,width)*show;
 float bevel=line(abs(edge-width*1.72),width*.35)*show*(1.-seam);
 c=mix(c,vec3(.016,.038,.041),seam*.97);
 return c+vec3(.38,.32,.17)*bevel*metallic;
}
`;
const WORLD_VERTEX = `
precision highp float;
in vec3 aPosition;in vec3 aNormal;in vec3 aColor;in vec2 aUV;in vec2 aKind;
uniform mat4 uVP;uniform mat4 uModel;uniform float uReflecting;
out vec3 vWorld;out vec3 vNormal;out vec3 vColor;out vec2 vUV;out vec2 vKind;
void main(){vec4 p=uModel*vec4(aPosition,1.);vWorld=p.xyz;vNormal=mat3(uModel)*aNormal;vColor=aColor;vUV=aUV;vKind=aKind;if(uReflecting>.5)p.y=-p.y;gl_Position=uVP*p;}
`;
const WORLD_FRAGMENT = COMMON_GLSL + `
in vec3 vWorld;in vec3 vNormal;in vec3 vColor;in vec2 vUV;in vec2 vKind;
uniform vec3 uEye;uniform vec3 uFog;uniform float uReflecting;uniform float uTravel;uniform float uCenter;
uniform vec2 uResolution;uniform sampler2D uReflection;
out vec4 outColor;
// Same lowland material on the main river and the merging end of a tributary.
// Increasing time moves patterns downstream toward decreasing absolute S.
vec3 lowlandWater(vec2 p,float fres){
 vec3 m=materialNoise(vec2(p.x*.31,p.y*.027+uTime*.035));
 vec2 screen=gl_FragCoord.xy/uResolution+vec2(m.g-.5,m.r-.5)*.004;
 vec3 re=texture(uReflection,clamp(screen,vec2(.002),vec2(.998))).rgb;
 vec3 c=mix(vec3(.13,.44,.56),vec3(.63,.85,.81),m.r*.52+m.g*.33);
 c=mix(c,re,.27+.34*fres);
 float strip=p.x*3.+.13*sin(p.y*.3);float seam=line(min(fract(strip),1.-fract(strip)),.01)*.42;
 c=mix(c,vec3(.03,.14,.17),seam);
 float edge=min(p.x,1.-p.x);
 c=mix(c,vec3(.015,.058,.077),1.-smoothstep(.004,.024,edge));
 c+=vec3(.47,.58,.46)*line(abs(edge-.037),.009)*.5;
 c+=vec3(.2,.29,.24)*pow(m.g,6.);
 return c;
}
void main(){
 if(uReflecting>.5&&vWorld.y<-.01)discard;
 float kind=vKind.x,id=vKind.y;
 vec3 eye=uEye;if(uReflecting>.5)eye.y=-eye.y;
 vec3 view=normalize(eye-vWorld),n=normalize(vNormal);if(dot(n,view)<0.)n=-n;
 float distance=length(eye-vWorld),fres=pow(1.-max(0.,dot(n,view)),3.);
 vec3 light=normalize(vec3(-.48,.73,.46));
 float diffuse=max(0.,dot(light,n));
 vec3 c=vColor;float paneEdge=1.,show=1.;
 vec2 matUV=vUV;
 if(kind<.5){
  vec2 p=vWorld.xz+vec2(uCenter,-uTravel);
  vec2 q=p*vec2(.133,.096);q+=vec2(.17*sin(p.y*.054)+.09*sin(p.x*.095),.13*cos(p.x*.10));
  vec3 ce=cell(q);paneEdge=ce.x;
  vec3 jade=mix(vec3(.115,.38,.35),vec3(.40,.69,.58),ce.y);
  vec3 lapis=mix(vec3(.06,.25,.36),vec3(.19,.48,.51),ce.y);
  c=mix(jade,lapis,smoothstep(.15,.88,.5+.5*sin(floor(q.y)*.78+floor(q.x)*1.33))*.7);
  if(ce.y>.93)c=mix(c,vec3(.59,.64,.40),.56);
  c=marbled(c,p*.034+ce.y*.09,1.4);
  // The floor is matte glass mosaic; the reflection target remains for water.
  c=leaded(c,ce.x,.010,.74,1.-smoothstep(230.,650.,distance));
 }else if(kind<1.5){
  // Original procedurally drawn nested-crest atlas, warped onto varied 3D ridges.
  // Sampling a continuous texture avoids derivative spikes at analytical seams.
  vec2 uv=vec2(vUV.x*2.+floor(id*5.)*.2,vUV.y*.75+floor(id*4.)*.125);
  uv.x+=.024*sin(vUV.y*5.5+id*6.283185);
  vec3 pane=texture(uMotif,uv).rgb;
  float ink=1.-smoothstep(.15,.23,max(pane.g,pane.b));
  c=marbled(pane*vColor,vUV*vec2(2.4,1.7)+vec2(id*.17,id*.34),.76);
  c*=.91+.31*diffuse;
  // Coarse sculpted ridges remain readable in addition to fine glass panes.
  float broad=.5+.5*cos(vUV.x*35.+vUV.y*2.+id*9.);
  c*=.94+.11*broad;
  vec3 bumped=normalize(n+vec3(sin(vUV.y*50.+id)*.035,sin(vUV.x*65.)*.05,0.));
  c+=vec3(.36,.43,.26)*pow(max(0.,dot(normalize(light+view),bumped)),48.)*.29*(1.-ink);
  c+=vec3(.07,.12,.10)*fres*.22*(1.-ink);
  float show=1.-smoothstep(350.,950.,distance);
  float silhouette=1.-smoothstep(.018,.065,abs(dot(n,view)));
  c=mix(c,vec3(.018,.062,.070),silhouette*.47*show);
 }else if(kind<2.5){
  vec2 p=vUV;float a=atan(p.y,p.x);float r=length(p);
  c=marbled(c,p*.32+vec2(id*.07,.1),1.1);
  c*=1.02+.26*diffuse;
  vec3 leafCell=cell(p*3.2+id);c=leaded(c,leafCell.x,.010,.45,.50);
  float veins=line(abs(sin(a*8.)),.029)*smoothstep(.17,.8,r);
  float ring=line(abs(r-.63),.010)*.62;
  c=mix(c,vec3(.016,.09,.065),veins*.8+ring*.3);
  c+=vec3(.33,.33,.14)*line(abs(sin(a*8.+.075)),.018)*.36;
  c+=vec3(.13,.20,.10)*fres*.24;
 }else if(kind<3.5){
  c=marbled(c,vec2(vUV.x*.64,vUV.y*1.8)+id*.11,1.);
  float cracks=line(abs(sin(vUV.x*18.+sin(vUV.y*19.)*.8)),.055);
  c=mix(c,vec3(.07,.075,.048),cracks*.64);
  c*=.84+.24*diffuse;
  c+=vec3(.31,.24,.12)*pow(max(0.,dot(normalize(light+view),n)),35.)*.27;
 }else if(kind<4.5){
  c=marbled(c,vUV*.52+id*.07,1.3);
  vec3 ce=cell(vUV*1.5+id*.37);
  c=leaded(c,ce.x,.008,.5,.68);
  c*=.99+.07*diffuse;
  c+=vec3(.22,.19,.11)*pow(max(0.,dot(normalize(light+view),n)),30.)*.22;
 }else if(kind<5.5){
  // Curved water is shaded in travel-time coordinates, not screen/world Y.
  // Two unequal scales avoid the old evenly spaced white/blue barcode.
  vec2 p=vUV;float flow=p.y-uTime;
  vec3 m=materialNoise(vec2(p.x*.82+.047*sin(flow*.84+id),flow*.13+id));
  vec3 fine=materialNoise(vec2(p.x*2.15+id*.13,flow*.32-id*.07));
  float filament=pow(m.g,.72)*(.58+.42*fine.r);
  float broken=pow(fine.g,3.)*(.5+.5*m.b);
  float slope=vColor.b;
  float edge=min(p.x,1.-p.x);
  vec3 clear=mix(vec3(.045,.28,.37),vec3(.26,.63,.68),m.r*.65+fine.r*.20);
  vec3 opal=mix(vec3(.46,.77,.81),vec3(.87,.96,.91),filament);
  c=mix(clear,opal,.26+filament*.45+slope*.08);
  // Local whitewater at changes of slope, then a spreading foot pool.
  float foam=clamp(vColor.r*(.48+.88*fine.r)+broken*.19,0.,.81);
  foam*=smoothstep(.02,.10,vColor.g);
  c=mix(c,vec3(.87,.96,.92),foam);
  vec3 bumped=normalize(n+vec3((m.r-.5)*.08,(fine.r-.5)*.06,(m.g-.5)*.035));
  c+=vec3(.41,.51,.44)*pow(max(0.,dot(normalize(light+view),bumped)),54.)*.47;
  // A few irregular glass divisions, subordinate to the moving water.
  float pane=p.x*2.45+.09*sin(p.y*1.6+id)+.09*(m.r-.5);
  c=mix(c,vec3(.06,.24,.28),line(abs(fract(pane)-.5),.012)*.19*(1.-foam));
  float wetBank=(1.-smoothstep(.005,.054,edge))*(.6+.4*fine.g);
  c=mix(c,vec3(.06,.24,.27),wetBank*.64);
  c+=vec3(.21,.36,.34)*line(abs(edge-.026-.012*m.r),.009)*.36;
  c*=.94+.08*diffuse;
 }else if(kind<6.5){
  c=vColor*(.83+.22*diffuse);
  c+=vec3(.28,.23,.13)*pow(max(0.,dot(normalize(light+view),n)),42.)*.3;
 }else if(kind<7.5){
  c=marbled(c,vUV*.6+id,1.0);c*=.92+.16*diffuse;
 }else if(kind<8.5){
  c=lowlandWater(vUV,fres);
 }else if(kind<9.5){
  // Mountain runoff slows and spreads through a curved plunge pool.
  vec2 p=vUV;
  vec3 m=materialNoise(vec2(p.x*.54+id*.17,p.y*.062-uTime*.115));
  vec3 f=materialNoise(vec2(p.x*1.57+id,p.y*.118-uTime*.215));
  vec2 screen=gl_FragCoord.xy/uResolution+vec2(m.g-.5,f.r-.5)*.0034;
  vec3 re=texture(uReflection,clamp(screen,vec2(.002),vec2(.998))).rgb;
  c=mix(vec3(.10,.38,.46),vec3(.42,.72,.73),m.r*.65+f.g*.24);
  c=mix(c,re,.25+.29*fres);
  // Uneven foam curls expand below the fall and disappear downstream.
  float foamFall=exp(-p.y*.31);
  float crossRipple=.5+.5*sin(p.y*1.73-uTime*2.5+1.8*sin(p.x*5.1+id));
  float foam=(.25+.60*pow(f.g,1.6))*foamFall
   +pow(crossRipple,11.)*(.15+.16*m.r)*exp(-p.y*.055);
  c=mix(c,vec3(.88,.96,.90),clamp(foam,0.,.79));
  float edge=min(p.x,1.-p.x);
  c=mix(c,vec3(.025,.14,.18),(1.-smoothstep(.003,.023,edge))*.62);
  c+=vec3(.30,.46,.40)*line(abs(edge-.030-.012*m.r),.008)*.26;

  let renderer=null,world=null,state=null,changing=false,raf=0,frames=0,last=0,lastUI=performance.now(),hidden=document.hidden,destroyed=false;
 const audio=new ValleyAudio(),input={steer:0,fast:false,slow:false},keys=new Set();let pointer=null,toastTimer=0;
 function notice(text){$('toast').textContent=text;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2300);}
 function pauseUI(){if(!state)return;$('pause').setAttribute('aria-pressed',String(state.paused));$('pause').setAttribute('aria-label',state.paused?'계속 재생':'일시 정지');$('pause-icon').classList.toggle('hidden',state.paused);$('play-icon').classList.toggle('hidden',!state.paused);}
 function pause(value){state.paused=value===undefined?!state.paused:!!value;pauseUI();world.render();}
 function clearInput(){keys.clear();input.steer=0;input.fast=input.slow=false;pointer=null;if(state){state.lookX=0;state.lookY=0;}}
 function wakeUI(){lastUI=performance.now();document.body.classList.remove('idle');}
 function panel(name){for(const [id,button]of [['help-panel','help'],['speed-panel','speed']]){const open=id===name&&!$(id).classList.contains('open');$(id).classList.toggle('open',open);$(id).setAttribute('aria-hidden',String(!open));$(button).setAttribute('aria-expanded',String(open));}wakeUI();}
 function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>notice('이 브라우저에서는 전체 화면을 사용할 수 없습니다.'));else document.exitFullscreen?.();}
 function immersive(){panel(null);document.body.classList.toggle('immersive');}
 function resize(){if(!renderer)return;const dpr=Math.min(devicePixelRatio||1,1.5,1920/innerWidth);renderer.resize(innerWidth,innerHeight,dpr);if(world)world.render();}
 function speed(value){state.targetSpeed=clamp(value,2,16);$('speed-range').value=String(state.targetSpeed);$('speed-range').setAttribute('aria-valuetext',state.targetSpeed.toFixed(1));}
 async function regenerate(seed){
  if(changing||destroyed)return;changing=true;document.body.classList.add('changing');panel(null);clearInput();
  await new Promise(r=>setTimeout(r,230));
  if(destroyed)return;
  const wasPaused=state.paused,velocity=state.targetSpeed;
  world.dispose();state=createFlight(seed===undefined?crypto.getRandomValues(new Uint32Array(1))[0]:seed>>>0);state.paused=wasPaused;state.targetSpeed=velocity;state.speed=velocity;
  world=new ValleyWorld(renderer,state);await world.initialize();if(destroyed)return;world.render();pauseUI();
  try{const url=new URL(location.href);url.searchParams.set('seed',String(state.seed));history.replaceState(null,'',url);}catch{}
  changing=false;last=performance.now();document.body.classList.remove('changing');
 }
 function capture(){world.render();canvas.toBlob(blob=>{if(!blob){notice('이미지를 저장하지 못했습니다.');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='glass-valley-'+state.seed+'-'+Math.floor(state.s)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),40);},'image/png');}
 try{
  const [image,motif]=await Promise.all([GLASS_TEXTURE,MOTIF_TEXTURE].map(async url=>{const image=new Image();image.src=url;await image.decode();return image;}));if(destroyed)return;renderer=await makeRenderer(canvas,image,motif);resize();
  state=createFlight(parseSeed(params.get('seed')||'389117'));state.paused=params.has('paused')||matchMedia('(prefers-reduced-motion: reduce)').matches;
  world=new ValleyWorld(renderer,state);await world.initialize();if(params.has('at')){state.s=Math.max(0,Number(params.get('at'))||0);await world.settle();world.update();}world.render();pauseUI();
  $('backend').textContent=renderer.backend;document.body.classList.add('ready');setTimeout(()=>$('loader').remove(),700);
  $('pause').onclick=()=>pause();$('fullscreen').onclick=fullscreen;$('capture').onclick=capture;$('regenerate').onclick=()=>regenerate().catch(fail);
  $('help').onclick=()=>panel('help-panel');$('speed').onclick=()=>panel('speed-panel');$('speed-range').oninput=e=>speed(Number(e.target.value));
  $('time').onclick=()=>{state.phase=(state.phase+.22)%1;world.render();};$('immersive').onclick=immersive;$('restore').onclick=immersive;
  $('sound').onclick=async()=>{try{const enabled=await audio.toggle();$('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'물소리 끄기':'물소리 켜기');$('sound-off').classList.toggle('hidden',enabled);$('sound-on').classList.toggle('hidden',!enabled);audio.update(state,hidden);}catch{notice('소리를 재생하지 못했습니다.');}};
  canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();wakeUI();panel(null);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,lookX:state.lookX,lookY:state.lookY};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;state.lookX=clamp(pointer.lookX+(e.clientX-pointer.x)/Math.max(600,innerWidth)*2.1,-.9,.9);state.lookY=clamp(pointer.lookY+(e.clientY-pointer.y)/Math.max(600,innerHeight)*.3,-.055,.105);});
  function release(e){if(pointer&&e.pointerId===pointer.id){pointer=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}}
  canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',()=>{pointer=null;});
  canvas.addEventListener('dragstart',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{e.preventDefault();speed(state.targetSpeed-Math.sign(e.deltaY)*.5);wakeUI();},{passive:false});
  document.addEventListener('pointermove',wakeUI,{passive:true});
  document.addEventListener('keydown',e=>{
   if(e.target.tagName==='INPUT')return;
   if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)&&e.target.tagName!=='BUTTON')e.preventDefault();
   keys.add(e.code);input.steer=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);input.fast=keys.has('KeyW')||keys.has('ArrowUp');input.slow=keys.has('KeyS')||keys.has('ArrowDown');
   if(!e.repeat){if((e.code==='Space'&&e.target.tagName!=='BUTTON')||e.code==='KeyP')pause();else if(e.code==='KeyF')fullscreen();else if(e.code==='KeyH')immersive();else if(e.code==='KeyR')regenerate().catch(fail);else if(e.code==='Escape'){panel(null);document.body.classList.remove('immersive');}}
   wakeUI();
  });
  document.addEventListener('keyup',e=>{keys.delete(e.code);input.steer=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);input.fast=keys.has('KeyW')||keys.has('ArrowUp');input.slow=keys.has('KeyS')||keys.has('ArrowDown');});
  window.addEventListener('blur',clearInput);window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now();clearInput();audio.update(state,hidden);});
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);fail(new Error('그래픽 연결이 끊겼습니다. 페이지를 새로 열어 주세요.'));});
  function frame(now){raf=requestAnimationFrame(frame);const dt=last?Math.min(.06,Math.max(0,(now-last)/1000)):0;last=now;if(hidden||changing)return;
   advanceFlight(state,dt,input);
   const oldYaw=state.yaw,oldPitch=state.pitch;
   if(state.paused){state.yaw=damp(state.yaw,state.lookX,3.5,dt);state.pitch=damp(state.pitch,state.lookY,3.5,dt);}
   const movingView=Math.abs(state.yaw-oldYaw)+Math.abs(state.pitch-oldPitch)>1e-6;
   if(!state.paused||movingView){try{world.update();world.render();frames++;}catch(error){cancelAnimationFrame(raf);fail(error);}}
   audio.update(state,hidden);
   if(now-lastUI>4500)document.body.classList.add('idle');
  }
  // Intentionally exposed diagnostics for reproducible render and lifecycle tests.
  window.__GLASS_VALLEY__={
   state:()=>({...state,backend:renderer.backend,chunks:[...world.chunks.keys()],meshes:renderer.meshes.length,frames,stats:{...renderer.stats,terrainEntries:world.terrain.entries.size,terrainPending:[...world.terrain.entries.values()].filter(e=>!e.chunk).length},resolution:[canvas.width,canvas.height],input:{...input},changing}),
   pause,render:()=>world.render(),regenerate,
   seek:async(s)=>{state.s=Math.max(0,Number(s)||0);await world.settle();world.update();world.render();},
   advance:async(seconds)=>{const paused=state.paused;state.paused=false;for(let t=0;t<seconds;t+=1/60){advanceFlight(state,Math.min(1/60,seconds-t),input);if(Math.floor(state.s/VALLEY.chunk)!==Math.floor((state.s-state.speed/60)/VALLEY.chunk))world.update();}state.paused=paused;await world.settle();world.update();world.render();},
   setPhase:p=>{state.phase=((p%1)+1)%1;world.render();},
   camera:()=>world.camera(canvas.width/canvas.height),
   snapshot:()=>{world.render();return canvas.toDataURL('image/png');},
    profiles:PROFILES.map(p=>p.name),
    destroy:()=>{if(destroyed)return;destroyed=true;cancelAnimationFrame(raf);clearInput();world?.dispose();renderer?.dispose();audio.ctx?.close();}
  };
   window.addEventListener('pagehide',()=>window.__GLASS_VALLEY__?.destroy(),{once:true});
  last=performance.now();raf=requestAnimationFrame(frame);
 }catch(e){fail(e);}
 function fail(e){console.error(e);$('error-text').textContent=e?.message||'장면을 만들지 못했습니다.';$('error').classList.add('open');$('loader')?.remove();}
})();
</script></body></html>
