<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arctic Aurora adapter</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}#error{display:none;color:#eee;padding:40px;font:14px system-ui}.failed #error{display:block}.failed iframe{display:none}</style></head>
<body><iframe id="world" src="./index.html?player=1" title="Arctic Aurora"></iframe><div id="error">장면을 준비하지 못했습니다. 다시 선택해 주세요.</div>
<script type="module">
import { connectWorld } from "../../app/adapter.js";
const frame = document.querySelector("#world");
let errorReported = false;
function reportError() {
  if (errorReported) return;
  errorReported = true;
  parent.postMessage({ source: "daydream-gallery-world", world: "arctic-aurora", type: "error" }, location.origin);
}
connectWorld({
  world: "arctic-aurora", frame, scenes: false,
  resolve() {
    const api = frame.contentWindow?.arcticAurora;
    if (api?.failed) reportError();
    return api ? { ready: api.ready, player: api.player } : null;
  },
  prepare(doc) {
    doc?.defaultView?.addEventListener("arctic-aurora-error", reportError, { once: true });
  }
});
</script></body></html>
