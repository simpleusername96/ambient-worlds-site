<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillwater adapter</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}#error{display:none;color:#dce5df;background:#14221d;padding:40px;font:14px system-ui}.failed #error{display:block}.failed iframe{display:none}</style></head>
<body><iframe id="world" src="./source/pond.html?player=1" title="Stillwater"></iframe><div id="error">Stillwater를 준비하지 못했습니다.</div>
<script type="module">
import { connectWorld } from "../../app/adapter.js";
const frame = document.querySelector("#world");
connectWorld({
 world:"stillwater",frame,
 resolve(){const api=frame.contentWindow?.stillwater;return api?{ready:api.ready,player:api.player}:null;}
});
</script></body></html>
