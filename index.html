<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <meta name="description" content="명상과 집중을 위한 무료 앰비언트 비주얼 플레이어. 사람의 아트 디렉션과 GPT 기반 AI 코딩 협업으로 만든 절차적 풍경 Journey와 Stillwater를 감상하세요.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://ambient-worlds.pages.dev/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="Ambient Worlds">
  <meta property="og:title" content="Ambient Worlds — 무한히 재생되는 평화로운 풍경">
  <meta property="og:description" content="명상과 집중을 위한 무료 앰비언트 비주얼 플레이어. Journey와 Stillwater의 아름다운 절차적 풍경을 감상하세요.">
  <meta property="og:url" content="https://ambient-worlds.pages.dev/">
  <meta property="og:image" content="https://ambient-worlds.pages.dev/screenshots/stillwater.png">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="900">
  <meta property="og:image:alt" content="노을빛 하늘 아래 연꽃과 물고기가 움직이는 Stillwater 연못 풍경">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ambient Worlds — 무한히 재생되는 평화로운 풍경">
  <meta name="twitter:description" content="명상과 집중을 위한 무료 앰비언트 비주얼 플레이어">
  <meta name="twitter:image" content="https://ambient-worlds.pages.dev/screenshots/stillwater.png">
  <title>Ambient Worlds — 무한히 재생되는 평화로운 풍경</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app/styles.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ambient Worlds",
      "url": "https://ambient-worlds.pages.dev/",
      "description": "명상과 집중을 위한 무료 앰비언트 비주얼 플레이어. 아름다운 절차적 풍경 Journey와 Stillwater를 무한히 감상할 수 있습니다.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "isAccessibleForFree": true,
      "image": "https://ambient-worlds.pages.dev/screenshots/stillwater.png",
      "sameAs": "https://github.com/simpleusername96/ambient-worlds-site",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>
<body>
  <main id="stage" aria-label="현재 비주얼 월드">
    <div id="referenceBackdrop" aria-hidden="true"></div>
    <div id="worldSlot"></div>
    <canvas id="frozenScene" aria-hidden="true"></canvas>
    <div id="transitionVeil" aria-hidden="true"></div>
    <div id="worldStatus" role="status" aria-live="polite"></div>
    <div id="loadingNotice" hidden><span class="loadingPulse" aria-hidden="true"></span><span id="loadingText" role="status" aria-live="polite"></span><button id="retryWorld" type="button" hidden>다시 시도</button></div>
  </main>

  <nav id="worldSwitcher" class="chrome" aria-label="프로젝트 탐색">
    <select id="worldSelect" aria-label="프로젝트 선택"></select>
  </nav>

  <aside id="aboutPanel" class="chrome" aria-label="Ambient Worlds 정보">
    <details>
      <summary title="프로젝트 정보" aria-label="프로젝트 정보 보기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      </summary>
      <section class="aboutCard">
        <img src="screenshots/stillwater.png" width="1600" height="900" loading="lazy" alt="노을빛 하늘 아래 연꽃과 물고기가 움직이는 Stillwater 연못 풍경">
        <div class="aboutCopy">
          <h1>Ambient Worlds</h1>
          <p>아름답고 평화로운 풍경을 계속 감상할 수 있는 무료 앰비언트 비주얼 플레이어입니다. 명상, 집중, 휴식 또는 조용한 배경이 필요할 때 Journey와 Stillwater를 재생해 보세요.</p>
          <p>사람의 아트 디렉션과 선택을 바탕으로 GPT 기반 AI 코딩 협업을 통해 만들었습니다. 장면은 브라우저에서 절차적으로 움직이며 끝없이 이어집니다.</p>
          <a class="sourceLink" href="https://github.com/simpleusername96/ambient-worlds-site" target="_blank" rel="noopener noreferrer">GitHub에서 공개 코드 보기</a>
        </div>
      </section>
    </details>
  </aside>

  <div id="playerControls" class="chrome" aria-label="재생 조작">
    <button type="button" id="playPause" class="iconButton" title="정지" aria-label="정지" aria-pressed="false">
      <svg class="pauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
      <svg class="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l9 6-9 6z"/></svg>
    </button>
    <button type="button" id="randomScene" class="sceneButton" title="새로운 장면 보기 · R" aria-label="새 장면 보기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c4 0 5 10 9 10h4M17 14l3 3-3 3M4 17h3c1.7 0 2.9-1.8 4-4M15 7h5M17 4l3 3-3 3"/></svg>
    </button>
    <button type="button" id="sound" class="iconButton" title="소리 켜기" aria-label="소리 켜기" aria-pressed="false">
      <svg class="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h4l4-4v12l-4-4H5zM16 9c1 1 1 5 0 6M19 7c2 3 2 7 0 10"/></svg>
      <svg class="soundOffIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h4l4-4v12l-4-4H5zM17 10l4 4M21 10l-4 4"/></svg>
    </button>
    <button type="button" id="focusView" class="iconButton" title="화면만 보기" aria-label="컨트롤 숨기기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-5 9-5 9 5 9 5-3.5 5-9 5-9-5-9-5M4 4l16 16"/></svg>
    </button>
  </div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
